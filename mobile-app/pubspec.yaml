name: codex_remote
description: Control Codex from your mobile device through the VS Code extension and relay server.
publish_to: 'none'
version: 0.2.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - images/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#091B33"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21
